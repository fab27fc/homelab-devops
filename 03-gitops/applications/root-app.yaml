apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: apps-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/fab27fc/homelab-devops.git
    targetRevision: main
    path: 03-gitops/argocd-apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
