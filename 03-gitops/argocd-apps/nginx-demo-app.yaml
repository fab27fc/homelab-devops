apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/fab27fc/homelab-devops.git
    targetRevision: main
    path: 01-kubernetes/apps/nginx-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: applications

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
